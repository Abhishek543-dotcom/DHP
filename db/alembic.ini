[alembic]
# Single shared migrations directory for both job-service and metadata-service
# (they share one PostgreSQL database).
script_location = migrations
prepend_sys_path = .
sqlalchemy.url = driver://user:pass@host/dbname

# We override sqlalchemy.url at runtime from env.py using DATABASE_URL_SYNC.
# Async URLs (postgresql+asyncpg://) cannot be used by Alembic directly;
# the env loader rewrites them to the sync psycopg driver.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
